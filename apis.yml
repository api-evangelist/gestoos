name: Gestoos
description: >-
  Gestoos was a computer-vision company that built a real-time gesture-recognition
  and touchless-interaction SDK, letting developers add camera-based hand-gesture
  and motion control to interactive installations, digital signage, kiosks, and
  embedded devices. Its public developer surface centered on an interactive SDK
  with sample integrations (including bindings for the Cinder C++ creative-coding
  framework). The company was surfaced as a portfolio company of 500 Global. As of
  this enrichment its primary web presence at gestoos.com is offline — the domain
  no longer resolves to the company and now redirects to an unrelated parked site —
  and the only surviving public developer asset is the gestoos GitHub organization,
  whose most recent activity dates to 2020. This profile is retained as a historical
  network record; the API/SDK product appears discontinued.
